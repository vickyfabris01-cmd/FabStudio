# FabStudio API (Cloudflare Worker). See docs/CONNECTIONS.md, section 2.
name = "fabstudio-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Private bucket: drafts, ideas, tunes, originals. Never public.
[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "fabstudio-private"

# Public bucket: only files you have published. Served through this Worker.
[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "fabstudio-public"

[vars]
SUPABASE_URL = "https://sylkgfkseqxppmxtxfvs.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5bGtnZmtzZXF4cHBteHR4ZnZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1Mzk4NzIsImV4cCI6MjExMDExNTg3Mn0.ksVzsa1qaTlSFo_iFy0z5QSot4i_-rnsqpa39p_IpLo"
OWNER_USER_ID = "fd462ef4-8cb3-4ec3-9ba5-ab0ef64d4e14"
# Exact addresses FabStudio runs on. No trailing slashes.
ALLOWED_ORIGINS = "https://fabstudio.pages.dev,http://localhost:8788,http://127.0.0.1:5500"
# Largest single file accepted, in MB.
MAX_UPLOAD_MB = "500"
SFU_APP_ID = "7f9c810f93f9fac265edad01aebd4477"

# Phase 3 (Live): ADD these to worker/wrangler.toml, then run `npx wrangler deploy` (docs/LIVE.md, section 3).
# Your existing lines stay exactly as they are.

# The live room. SQLite-backed, which is what the free Workers plan requires.
[[durable_objects.bindings]]
name = "LIVE_ROOM"
class_name = "LiveRoom"

[[migrations]]
tag = "v1-live-room"
new_sqlite_classes = ["LiveRoom"]

# Add this line inside your existing [vars] block (it is not a secret):
#  SFU_APP_ID = "7f9c810f93f9fac265edad01aebd4477"
#
# Then set the two secrets (never put them in this file):
#   npx wrangler secret put SFU_APP_SECRET           <- the Realtime App Secret
#   npx wrangler secret put SUPABASE_SERVICE_KEY     <- already set if guest merging works; Live needs it to save chat
