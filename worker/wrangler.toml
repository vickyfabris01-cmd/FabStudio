# FabStudio API (Cloudflare Worker). See docs/CONNECTIONS.md, section 2.
name = "fabstudio-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# R2 bucket binding. The bucket must exist first (CONNECTIONS.md 2.2).
# The name on the right must match the bucket you created, the binding name must stay PRIVATE_BUCKET.
[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "fabstudio-private"

[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "fabstudio-public"

