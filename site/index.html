<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14121a">
  <link rel="icon" type="image/png" href="/img/fabris-poet-favicon.png">
  <link rel="apple-touch-icon" href="/img/fabris-poet-apple-touch.png">
  <title>Fabris Poet</title>
  <meta name="description" content="Poems, read aloud.">
  <meta property="og:title" content="Fabris Poet">
  <meta property="og:description" content="Poems, read aloud.">
  <link rel="stylesheet" href="/css/public.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img class="brand-mark" src="/img/fabris-poet-mark.png" alt="" width="34" height="34"><span>Fabris Poet</span></a>
    <button id="account" class="chip" type="button">Sign in</button>
  </header>
  <main class="wrap wide">
    <section id="hero" class="hero-card">
      <div class="hero-in">
        <div class="hero-brand"><img class="hero-mark" src="/img/fabris-poet-mark.png" alt="" width="44" height="44"><span class="tagline">Words · Music · Soul</span></div>
        <h1>Listen live. Or any time.</h1>
        <p>Join Fabris live for poems read aloud, then replay every poem and live recap. Unlimited and free.</p>
      </div>
    </section>
    <div id="filters" class="filters" hidden></div>
    <div id="grid" class="pgrid"><p class="empty">Loading…</p></div>
  </main>
  <footer class="foot"><span>FabisPot</span><a href="/policies/">Rights and policies</a></footer>
  <noscript><p class="wrap">Fabris Poet needs JavaScript to play poems.</p></noscript>
  <script src="/shared/vendor/supabase.js"></script>
  <script type="module" src="/js/home.js"></script>
</body>
</html>
